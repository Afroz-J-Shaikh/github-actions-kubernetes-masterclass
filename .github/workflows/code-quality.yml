name: code quality

on:
  workflow_call:

jobs:

  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:

      - name: code checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install golangci-lint from binary
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.9.0

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: './...'

  validate-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Code checkout
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node_map: '22'

      # 1. Lint HTML files
      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      # 2. Lint CSS files
      # Dynamically creates a physical temporary config file for stylelint
      - name: Lint CSS
        run: |
          echo '{"rules": {"color-no-invalid-hex": true, "block-no-empty": true}}' > .stylelintrc.json
          npx stylelint "**/*.css" --config .stylelintrc.json
          rm .stylelintrc.json

      # 3. Lint JavaScript files
      # Dynamically creates a physical temporary flat config file for eslint
      - name: Lint JS
        run: |
          echo 'export default [{ languageOptions: { globals: { window: "readonly", document: "readonly", localStorage: "readonly", fetch: "readonly", confirm: "readonly", setTimeout: "readonly", console: "readonly" } }, rules: { "no-undef": "error" } }];' > eslint.config.js
          npx eslint "**/*.js" --no-config-lookup --config eslint.config.js
          rm eslint.config.js