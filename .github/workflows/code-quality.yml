name: code quality

on:
  workflow_call:

jobs:

  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:

      - name: code checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'   # adjust to your Go version
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Verify go.mod is tidy
        # Fails the build if 'go mod tidy' generates any git diff changes
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install golangci-lint from source
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out results.sarif ./...'

  validate-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Code checkout
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node_map: '20'

      # 1. Lint HTML files
      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      # 2. Lint CSS files
      # Dynamically creates a physical temporary config file for stylelint
      - name: Lint CSS
        run: |
          echo '{"rules": {"color-no-invalid-hex": true, "block-no-empty": true}}' > .stylelintrc.json
          npx stylelint "**/*.css" --config .stylelintrc.json
          rm .stylelintrc.json

      # 3. Lint JavaScript files
      # Dynamically creates a physical temporary flat config file for eslint
      - name: Lint JS
        run: |
          echo 'export default [{ languageOptions: { globals: { window: "readonly", document: "readonly", localStorage: "readonly", fetch: "readonly", confirm: "readonly", setTimeout: "readonly", console: "readonly" } }, rules: { "no-undef": "error" } }];' > eslint.config.js
          npx eslint "**/*.js" --no-config-lookup --config eslint.config.js
          rm eslint.config.js