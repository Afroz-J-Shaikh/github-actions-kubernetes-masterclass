name: code quality

on:
  workflow_dispatch:

jobs:

  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:

      - name: code checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'   # adjust to your Go version
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Verify go.mod is tidy
        # Fails the build if 'go mod tidy' generates any git diff changes
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Install golangci-lint from source
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out results.sarif ./...'

  validate-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Uses a modern Node version
          cache: 'npm'       # Automatically caches node_modules if package-lock.json is inside TARGET_DIR

      - name: Install Linting Tools
        # Safely installs the linters globally on the runner or pulls via npx
        run: npm install -g eslint stylelint htmlhint

      - name: Run ESLint (JavaScript)
        # Scans all JS files. Adjust extensions (e.g., .jsx, .ts) if needed.
        run: eslint "**/*.js" --max-warnings=0

      - name: Run Stylelint (CSS)
        # Scans all CSS files. Adjust pattern to "**/*.scss" if using Sass.
        run: npx stylelint "**/*.css"

      - name: Run HTMLHint (HTML)
        # Scans all HTML files and formats results cleanly
        run: htmlhint "**/*.html"
      