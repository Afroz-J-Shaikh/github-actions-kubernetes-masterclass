name: dependency scan

on: 
  workflow_dispatch:

jobs:
 
  dependencies-check-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
     
      - name: code checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'   # adjust to your Go version
          cache: false

      - name: Run govulncheck (Official Go Vulnerability Tool)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  dependencies-check-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
     
      - name: code checkout
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'


