name: build & push image

on: 
  workflow_call:

permissions:
  contents: write

jobs:
 
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:

      - name: code checkout
        uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Shorten github sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build & push 
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.folder }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}/skillpulse-${{ matrix.folder }}:latest
            ${{ vars.DOCKERHUB_USER }}/skillpulse-${{ matrix.folder }}:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USER }}/skillpulse-${{ matrix.folder }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.folder }}
          cache-to: type=gha,mode=max,scope=${{ matrix.folder }}

  update-deployment:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Shorten github sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update Kubernetes deployment manifest
        run: |
          sed -i "s|image: ${{ vars.DOCKERHUB_USER }}/skillpulse-frontend:.*|image: ${{ vars.DOCKERHUB_USER }}/skillpulse-frontend:${{ env.SHORT_SHA }}|" k8s/40-frontend.yaml
          sed -i "s|image: ${{ vars.DOCKERHUB_USER }}/skillpulse-backend:.*|image: ${{ vars.DOCKERHUB_USER }}/skillpulse-backend:${{ env.SHORT_SHA }}|" k8s/30-backend.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/40-frontend.yaml k8s/30-backend.yaml
          git diff --staged --quiet || git commit -m "ci: update bankapp image to ${{ env.SHORT_SHA }} [skip ci]"
          git push