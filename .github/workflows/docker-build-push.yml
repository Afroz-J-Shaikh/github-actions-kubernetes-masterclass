name: build & push image

on: 
  workflow_dispatch:

jobs:
 
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:

      - name: code checkout
        uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Shorten github sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: build & push 
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.folder }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}/skillpulse-${{ matrix.folder }}:latest
            ${{ vars.DOCKERHUB_USER }}/skillpulse-${{ matrix.folder }}:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USER }}/skillpulse-${{ matrix.folder }}:${{ env.SHORT_SHA }}

  update-deployment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [backend, frontend]

    steps:

      - name: Update Kubernetes deployment manifest
        run: |
          sed -i "s|image: ${{ vars.DOCKERHUB_USER }}/skillpulse-${{ matrix.folder }}:.*|image: ${{ vars.DOCKERHUB_USER }}/skillpulse-${{ matrix.folder }}:${{ env.SHORT_SHA }}|" k8s/${{ matrix.folder }}.yml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/${{ matrix.folder }}.yml
          git diff --staged --quiet || git commit -m "ci: update bankapp image to ${{ env.SHORT_SHA }} [skip ci]"
          git push 